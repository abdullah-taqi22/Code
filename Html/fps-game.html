
<!DOCTYPE html>
<html>
<head>
<title>Ultimate FPS Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    color: white;
    font-size: 19px;
    line-height: 1.7;
    text-shadow: 2px 2px black;
    pointer-events: none;
}

#crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 30px;
    pointer-events: none;
}

#ammo {
    position: fixed;
    bottom: 25px;
    right: 30px;
    color: white;
    font-size: 25px;
    text-shadow: 2px 2px black;
}

#message {
    position: fixed;
    top: 45%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 25px;
    pointer-events: none;
}

#help {
    position: fixed;
    bottom: 15px;
    left: 15px;
    color: white;
    font-size: 13px;
    opacity: 0.8;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="ui">
    Health: <span id="health">100</span><br>
    Score: <span id="score">0</span>
</div>

<div id="crosshair">+</div>

<div id="ammo">Ammo: 12 / 12</div>

<div id="message">CLICK TO PLAY</div>

<div id="help">
    WASD: Move | SPACE: Jump | MOUSE: Aim | CLICK: Shoot | R: Reload
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// =============================
// SCENE
// =============================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(0x87ceeb, 30, 100);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

document.body.appendChild(renderer.domElement);

// =============================
// LIGHTING
// =============================

const light = new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    2
);

scene.add(light);

const sunlight = new THREE.DirectionalLight(
    0xffffff,
    1.5
);

sunlight.position.set(10, 20, 10);
scene.add(sunlight);

// =============================
// PLAYER
// =============================

camera.position.set(0, 2, 5);
scene.add(camera);

let yaw = 0;
let pitch = 0;

let velocityY = 0;
let grounded = true;

const gravity = 20;
const jumpPower = 8;

const keys = {};

let health = 100;
let score = 0;

// =============================
// GROUND
// =============================

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({
        color: 0x228822
    })
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;

scene.add(ground);

// =============================
// GUN MODEL
// =============================

const gun = new THREE.Group();

const blackMetal = new THREE.MeshStandardMaterial({
    color: 0x222222,
    metalness: 0.8,
    roughness: 0.3
});

const darkMetal = new THREE.MeshStandardMaterial({
    color: 0x555555,
    metalness: 0.7,
    roughness: 0.3
});

const gripMaterial = new THREE.MeshStandardMaterial({
    color: 0x38251a
});

// Gun body
const gunBody = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 0.18, 0.65),
    blackMetal
);

gun.add(gunBody);

// Gun barrel
const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.045, 0.045, 0.4, 12),
    darkMetal
);

barrel.rotation.x = Math.PI / 2;
barrel.position.z = -0.48;

gun.add(barrel);

// Gun handle
const handle = new THREE.Mesh(
    new THREE.BoxGeometry(0.13, 0.32, 0.17),
    gripMaterial
);

handle.position.set(0, -0.23, 0.12);
handle.rotation.x = -0.2;

gun.add(handle);

// Gun top sight
const sight = new THREE.Mesh(
    new THREE.BoxGeometry(0.07, 0.07, 0.12),
    darkMetal
);

sight.position.set(0, 0.12, -0.15);
gun.add(sight);

// Position gun in front of camera
gun.position.set(0.38, -0.35, -0.65);

camera.add(gun);

// =============================
// MUZZLE FLASH
// =============================

const flash = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 8, 8),
    new THREE.MeshBasicMaterial({
        color: 0xffaa00
    })
);

flash.position.set(0, 0, -0.75);
flash.visible = false;

gun.add(flash);

let flashTimer = 0;

// =============================
// ENEMIES
// =============================

let enemies = [];

function spawnEnemy() {

    const enemy = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1.4, 0.7),
        new THREE.MeshStandardMaterial({
            color: 0xff2222
        })
    );

    body.position.y = 1;
    enemy.add(body);

    const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.65, 0.65, 0.65),
        new THREE.MeshStandardMaterial({
            color: 0xff7777
        })
    );

    head.position.y = 2.05;
    enemy.add(head);

    enemy.position.set(
        Math.random() * 24 - 12,
        0,
        -Math.random() * 35 - 5
    );

    enemy.userData.hp = 1;

    scene.add(enemy);
    enemies.push(enemy);
}

for (let i = 0; i < 8; i++) {
    spawnEnemy();
}

// =============================
// MOVEMENT INPUT
// =============================

document.addEventListener("keydown", (e) => {

    keys[e.key.toLowerCase()] = true;

    // Jump immediately when space is pressed
    if (e.code === "Space") {
        e.preventDefault();

        if (grounded) {
            velocityY = jumpPower;
            grounded = false;
        }
    }

    // Reload
    if (e.key.toLowerCase() === "r") {
        reload();
    }

});

document.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
});

// =============================
// MOUSE LOOK
// =============================

document.body.addEventListener("click", () => {

    if (document.pointerLockElement !== document.body) {
        document.body.requestPointerLock();
    }

});

document.addEventListener("pointerlockchange", () => {

    document.getElementById("message").style.display =
        document.pointerLockElement === document.body
        ? "none"
        : "block";

});

document.addEventListener("mousemove", (e) => {

    if (document.pointerLockElement !== document.body) return;

    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;

    pitch = Math.max(-1.5, Math.min(1.5, pitch));

    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

});

// =============================
// SHOOTING SYSTEM
// =============================

let ammo = 12;
const maxAmmo = 12;

let canShoot = true;
let reloading = false;

const raycaster = new THREE.Raycaster();

function shoot() {

    if (!canShoot || reloading) return;

    if (document.pointerLockElement !== document.body) return;

    if (ammo <= 0) {
        reload();
        return;
    }

    ammo--;

    updateUI();

    canShoot = false;

    setTimeout(() => {
        canShoot = true;
    }, 200);

    // Recoil
    gun.position.z = -0.52;
    gun.rotation.x = -0.08;

    // Muzzle flash
    flash.visible = true;
    flashTimer = 0.06;

    // Raycast from crosshair
    raycaster.setFromCamera(
        new THREE.Vector2(0, 0),
        camera
    );

    const hits = raycaster.intersectObjects(
        enemies,
        true
    );

    if (hits.length > 0) {

        let hitObject = hits[0].object;

        let enemy = hitObject;

        while (
            enemy.parent &&
            !enemies.includes(enemy)
        ) {
            enemy = enemy.parent;
        }

        if (enemies.includes(enemy)) {

            scene.remove(enemy);

            enemies = enemies.filter(
                e => e !== enemy
            );

            score += 10;

            spawnEnemy();

            updateUI();
        }
    }

}

document.addEventListener("mousedown", (e) => {

    if (e.button === 0) {
        shoot();
    }

});

// =============================
// RELOAD
// =============================

function reload() {

    if (reloading || ammo === maxAmmo) return;

    reloading = true;

    document.getElementById("ammo").innerText =
        "RELOADING...";

    setTimeout(() => {

        ammo = maxAmmo;
        reloading = false;

        updateUI();

    }, 1200);

}

// =============================
// USER INTERFACE
// =============================

function updateUI() {

    document.getElementById("health").innerText = health;

    document.getElementById("score").innerText = score;

    document.getElementById("ammo").innerText =
        "Ammo: " + ammo + " / " + maxAmmo;

}

// =============================
// ANIMATION LOOP
// =============================

let previousTime = performance.now();

function animate(now) {

    requestAnimationFrame(animate);

    const delta = Math.min(
        (now - previousTime) / 1000,
        0.05
    );

    previousTime = now;

    // Movement
    const speed = 7 * delta;

    if (keys["w"]) camera.translateZ(-speed);
    if (keys["s"]) camera.translateZ(speed);
    if (keys["a"]) camera.translateX(-speed);
    if (keys["d"]) camera.translateX(speed);

    // Gravity
    velocityY -= gravity * delta;

    camera.position.y += velocityY * delta;

    // Ground collision
    if (camera.position.y <= 2) {

        camera.position.y = 2;
        velocityY = 0;
        grounded = true;

        // Auto jump while holding space
        if (keys[" "]) {
            velocityY = jumpPower;
            grounded = false;
        }

    }

    // Gun recoil recovery
    gun.position.z +=
        (-0.65 - gun.position.z) * Math.min(delta * 15, 1);

    gun.rotation.x +=
        (0 - gun.rotation.x) * Math.min(delta * 15, 1);

    // Muzzle flash timer
    if (flashTimer > 0) {

        flashTimer -= delta;

        if (flashTimer <= 0) {
            flash.visible = false;
        }

    }

    // Render
    renderer.render(scene, camera);

}

// =============================
// START GAME
// =============================

requestAnimationFrame(animate);

// =============================
// RESIZE
// =============================

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
