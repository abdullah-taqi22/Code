<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexBox Demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css"
      rel="stylesheet"
    />
  </head>
  <style>
    .flexbox {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      flex-wrap: wrap;
      min-height: 300px;
    }
    .box {
      width: 200px;
      height: 125px;
      color: white;
      text-align: center;
      padding-top: 10px;
      font-weight: bold;
    }
    
    .box1 {
      flex-grow: 1;
    }
    .box2 {
      flex-grow: 4;
    }
    .box3 {
      flex-grow: 1;
    }
    .box4 {
      flex-grow: 3;
    }
  </style>
  <body>
    <div class="container">
      <div class="flexbox border border-1 border-dark d-flex justify-content-evenly align-items-center">
        <div class="box bg-primary box1">Box 1</div>
        <div class="box bg-success box2">Box 2</div>
        <div class="box bg-warning box3">Box 3</div>
        <div class="box bg-danger box4">Box 4</div>
      </div>
    </div>
  </body>
</html>
