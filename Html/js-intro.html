<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Intro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script>
      function changeColor() {
        let heading2 = document.getElementById("heading2");

        if (heading2.style.color == "blue") {
          heading2.style.color = "red";
        } else {
          heading2.style.color = "blue";
        }
      }
      function changeText() {
        let heading2 = document.getElementById("heading2");
        heading2.style.textDecoration = "underline";
        if (heading2.innerHTML == "Hi!") {
          heading2.innerHTML = ", How are you?";
        } else {
          heading2.innerHTML = "Hi!";
        }
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h2 id="heading2">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.
      </h2>
      <button class="btn btn-danger mt-4" onclick="changeColor()">
        Color
      </button>
      <button class="btn btn-secondary mt-4" onclick="changeText()">
        Text
      </button>
    </div>
  </body>
</html>
